[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-user-lab"
version = "0.1.0"
description = "Persistent synthetic users for reproducible browser workflow testing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
sul-evaluate = "synthetic_lab.evaluation.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
browser = ["playwright>=1.48,<2"]
oracle = ["oracledb>=2.5,<3"]
model = ["ollama>=0.4,<1"]
embeddings = ["sentence-transformers>=3,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
