services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synthetic_lab
      POSTGRES_USER: synthetic_lab
      POSTGRES_PASSWORD: synthetic_lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic_lab -d synthetic_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - synthetic_lab_pgdata:/var/lib/postgresql/data

volumes:
  synthetic_lab_pgdata:
